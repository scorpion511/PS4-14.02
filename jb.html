<!doctype html>
<html lang="en" manifest="cache.manifest">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SCORPION HOST PS4 FIRMWARE 14.02</title>
    <style>
      :root {
        --bg: #05080b;
        --panel: rgba(8, 14, 20, 0.88);
        --sunk: rgba(10, 18, 26, 0.9);
        --line: rgba(0, 229, 255, 0.35);
        --fg: #c8ced8;
        --bright: #00e5ff;
        --dim: #7c8798;
        --faint: #00e5ff;
        --ok: #00e5ff;
        --bad: #ff5c5c;
        --warn: #ffd166;
        --sans: "Segoe UI", system-ui, sans-serif;
        --mono: Consolas, "DejaVu Sans Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: var(--bg);
        /* Uncomment below ONLY if you upload img.jpg and add it to cache.manifest */
        /* background-image: url('img.jpg'); */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: var(--fg);
        font: 15px/1.45 var(--sans);
      }
      #brand {
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        text-align: center;
        box-shadow: 0 0 18px rgba(0, 229, 255, 0.2);
      }
      #brand b {
        color: #00e5ff;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-shadow: 0 0 10px #00e5ff,
                     0 0 20px #00e5ff;
      }
      #ramBox {
        overflow: hidden;
        padding: 6px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--sunk);
        color: #00e5ff;
        font: 12px/1.4 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: center;
        text-shadow: 0 0 6px rgba(0, 229, 255, 0.6);
      }
      /* Circular glowing scorpion emblem (static glow, no pulsing) */
      .meme {
        width: 90px;
        height: 90px;
        object-fit: cover;
        border-radius: 50%;
        border: 2px solid #00e5ff;
        box-shadow: 0 0 15px #00e5ff,
                    0 0 30px #00e5ff,
                    inset 0 0 15px #00e5ff;
        display: block;
        margin: 14px auto 6px auto;
      }
      #spin {
        position: fixed;
        top: calc(50% + 35px);
        left: 50%;
        width: 48px;
        height: 48px;
        margin: -24px 0 0 -24px;
        border: 4px solid rgba(0, 229, 255, 0.2);
        border-top-color: #00e5ff;
        border-radius: 50%;
        box-shadow: 0 0 15px rgba(0, 229, 255, 0.45);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 52%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: none;
        text-align: center;
        font-size: 18px;
        letter-spacing: 0.5px;
      }
      #state,
      #out {
        display: none;
      }
      body.done #spin,
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
        color: var(--bad);
        text-shadow: 0 0 10px rgba(255, 92, 92, 0.6);
      }
      body.done #msg {
        display: block;
        color: #00e5ff;
        font-weight: 700;
        letter-spacing: 2px;
        text-shadow: 0 0 10px #00e5ff,
                     0 0 20px #00e5ff;
      }
      body.log {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 10px 18px 55px;
      }
      body.log #state {
        display: block;
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
        color: #00e5ff;
        text-shadow: 0 0 10px #00e5ff;
        text-align: center;
      }
      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--sunk);
        font: 12px/1.45 var(--mono);
        white-space: pre-wrap;
        box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.12);
      }
      .contact-box {
        position: fixed;
        bottom: 10px;
        right: 14px;
        z-index: 99999;
      }
      .contact-number {
        font-size: 13px;
        font-weight: 700;
        color: #00e5ff;
        background: rgba(8, 14, 20, 0.9);
        padding: 5px 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 0 10px rgba(0, 229, 255, 0.25);
      }
      .notice {
        margin: 1em 0;
        padding: 0.7em 1em;
        border: 2px solid #e66;
        background: #2a1414;
        color: #f99;
        font: 700 20px/1.4 var(--sans);
      }
      .byline {
        position: fixed;
        bottom: 12px;
        left: 14px;
        margin: 0;
        color: #00e5ff;
        font: 700 13px/1 var(--mono);
        letter-spacing: 0.06em;
        text-shadow: 0 0 8px #00e5ff,
                     0 0 16px #00e5ff;
      }
      .ok {
        color: #00e5ff;
      }
      .bad {
        color: var(--bad);
      }
      .warn {
        color: var(--warn);
      }
      code {
        color: #80f0ff;
      }
    </style>
  </head>
  <body>
    <div id="brand"><b>SCORPION HOST PS4 FIRMWARE 14.02</b></div>
    <div id="ramBox">RAM: checking...</div>
    <img class="meme" src="logo_scorp.png" alt="Scorpion Host Logo" />
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <p class="byline">Designed and Compiled By Ahmed Essam</p>
    <div class="contact-box">
      <div class="contact-number">Contact: +201093424331</div>
    </div>
    <script type="module">
      import "./jb.js";
    </script>
  </body>
</html>
